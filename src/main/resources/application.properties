# Server
server.port=${PORT:8080}

# MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/flowboard_db?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET:mySecretKeyForFlowBoardProject2025!@#}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Load local profile if running locally
spring.profiles.active=local
