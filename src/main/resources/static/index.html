<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowBoard — Kanban Task Manager</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <!-- Auth Section -->
        <div id="auth-section" class="auth-container">
            <h1>🚀 FlowBoard</h1>
            <div class="auth-tabs">
                <button id="show-login" class="tab active">Login</button>
                <button id="show-register" class="tab">Register</button>
            </div>
            <form id="login-form" class="auth-form">
                <input type="text" id="login-username" placeholder="Username" required>
                <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Login</button>
            </form>
            <form id="register-form" class="auth-form" style="display:none;">
                <input type="text" id="reg-username" placeholder="Username" required>
                <input type="password" id="reg-password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Register</button>
            </form>
        </div>

        <!-- Board Section -->
        <div id="board-section" style="display:none;">
            <header>
                <h1>🚀 FlowBoard</h1>
                <div class="user-info">
                    <span id="username-display"></span>
                    <button id="logout-btn">Logout</button>
                </div>
            </header>

            <div class="board">
                <!-- TODO Column -->
                <div class="column" data-status="TODO" ondrop="dropEvent(event)" ondragover="allowDrop(event)">
                    <h2>📋 To Do <span id="count-todo">0</span></h2>
                    <div class="tasks" id="todo-tasks"></div>
                    <button class="add-task-btn" onclick="openAddModal('TODO')">+ Add</button>
                </div>

                <!-- IN_PROGRESS Column -->
                <div class="column" data-status="IN_PROGRESS" ondrop="dropEvent(event)" ondragover="allowDrop(event)">
                    <h2>⚙️ In Progress <span id="count-progress">0</span></h2>
                    <div class="tasks" id="progress-tasks"></div>
                    <button class="add-task-btn" onclick="openAddModal('IN_PROGRESS')">+ Add</button>
                </div>

                <!-- DONE Column -->
                <div class="column" data-status="DONE" ondrop="dropEvent(event)" ondragover="allowDrop(event)">
                    <h2>✅ Done <span id="count-done">0</span></h2>
                    <div class="tasks" id="done-tasks"></div>
                    <button class="add-task-btn" onclick="openAddModal('DONE')">+ Add</button>
                </div>
            </div>
        </div>

        <!-- Add/Edit Modal -->
        <div id="task-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <h2 id="modal-title">Add Task</h2>
                <input type="hidden" id="task-id">
                <input type="text" id="task-title" placeholder="Title" required>
                <textarea id="task-desc" placeholder="Description"></textarea>
                <select id="task-status">
                    <option value="TODO">To Do</option>
                    <option value="IN_PROGRESS">In Progress</option>
                    <option value="DONE">Done</option>
                </select>
                <div class="modal-btns">
                    <button id="save-task">Save</button>
                    <button id="cancel-modal">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
